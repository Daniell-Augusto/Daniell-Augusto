name: Update README Greeting

on:
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Greeting Text
        run: |
          HOUR=$(TZ="America/Sao_Paulo" date +%H)
          
          if [ "$HOUR" -ge 5 ] && [ "$HOUR" -lt 12 ]; then
            GREETING_PT="Bom+dia"
            GREETING_EN="Good+morning"
          elif [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 18 ]; then
            GREETING_PT="Boa+tarde"
            GREETING_EN="Good+afternoon"
          else
            GREETING_PT="Boa+noite"
            GREETING_EN="Good+evening"
          fi
          
          LINES="${GREETING_PT},+me+chamo+Daniel!!;${GREETING_EN},+my+name+is+Daniel!!"
          
          sed -i -E "s/lines=[^)]*/lines=${LINES}/g" README.md

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --staged --quiet || (git commit -m "chore: atualiza saudação automática do README" && git push)
